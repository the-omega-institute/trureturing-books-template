<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="carry-rules" data-lang="en" viewBox="0 0 420 356" width="420" height="356" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="Four rows, one carry rule each: adjacent rewrites neighbouring 1, 1 as a 1 one place up (charge 0); double_zero rewrites a 2 in the lowest place as a 1 one place up (charge +1); double_one rewrites a 2 in the next place as a 1 on either side (charge −1); double_succ rewrites a 2 in a general place as a 1 two places down and a 1 one place up (charge 0).">
<title>Four rows, one carry rule each: adjacent rewrites neighbouring 1, 1 as a 1 one place up (charge 0); double_zero rewrites a 2 in the lowest place as a 1 one place up (charge +1); double_one rewrites a 2 in the next place as a 1 on either side (charge −1); double_succ rewrites a 2 in a general place as a 1 two places down and a 1 one place up (charge 0).</title>
