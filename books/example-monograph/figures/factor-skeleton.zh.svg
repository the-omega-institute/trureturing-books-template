<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="factor-skeleton" data-lang="zh" viewBox="0 0 358 380" width="358" height="380" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="证明骨架图。顶部虚线框“黄金词 g”。第一个方框：窗口中 a 的个数等于 ⌊(i+m+1)/φ⌋ − ⌊(i+1)/φ⌋，依据 goldenWindowTrueCount_eq_floor。第二个方框：这个个数只看相位 x_i 落在 n 个分点切出的 n+1 段中的哪一段。由此分成两支：左支“至多 n+1 个：同一段给出同一个因子”，右支“至少 n+1 个：相位稠密，每段都有相位落入”。两支汇入底部绿色的 LEAN ✓ 方框“恰有 n+1 个因子”，即 golden_factor_complexity。">
<title>证明骨架图。顶部虚线框“黄金词 g”。第一个方框：窗口中 a 的个数等于 ⌊(i+m+1)/φ⌋ − ⌊(i+1)/φ⌋，依据 goldenWindowTrueCount_eq_floor。第二个方框：这个个数只看相位 x_i 落在 n 个分点切出的 n+1 段中的哪一段。由此分成两支：左支“至多 n+1 个：同一段给出同一个因子”，右支“至少 n+1 个：相位稠密，每段都有相位落入”。两支汇入底部绿色的 LEAN ✓ 方框“恰有 n+1 个因子”，即 golden_factor_complexity。</title>
