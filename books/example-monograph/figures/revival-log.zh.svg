<title>对数纵轴，横轴 n 从 1 到 14。青色的点沿一条上升的直线排列，是等待时间 F_n；品红的点沿一条下降的直线排列，是误差 |F_nφ − F_{n+1}| = φ^{−n}，两条直线斜率相反。中间白色的点是两者之积，即回归得分，在绿色虚线 1/√5 两侧上下交替，越来越贴近它。</title>
