<svg xmlns="http://www.w3.org/2000/svg" class="tr-fig" data-tr-fig="golden-rotation" data-lang="zh" viewBox="0 0 400 272" width="400" height="272" font-family="'Noto Sans SC', 'Noto Sans CJK SC', 'Source Sans 3', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif" role="img" aria-label="一个球，赤道是周长为 1 的相位圆，圆盘按两段着色：青色的一段（长 1/φ ≈ 0.618）对应字母 a，品红的一段（长 1/φ² ≈ 0.382）对应字母 b。赤道上标出相位 x₀ 到 x₇ 的点，按所在的段着色，旁边写着序号。一支绕竖直轴的箭头沿球外从 x₀ 转到 x₁，标注“转过 1/φ”。">
<title>一个球，赤道是周长为 1 的相位圆，圆盘按两段着色：青色的一段（长 1/φ ≈ 0.618）对应字母 a，品红的一段（长 1/φ² ≈ 0.382）对应字母 b。赤道上标出相位 x₀ 到 x₇ 的点，按所在的段着色，旁边写着序号。一支绕竖直轴的箭头沿球外从 x₀ 转到 x₁，标注“转过 1/φ”。</title>
