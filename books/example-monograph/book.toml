# 示例专著：演示定理环境、Lean 引用、双语对齐、可视化/视频/幻灯片嵌入与三种导出。
[book]
version = "0.1.0"
authors = ["The Omega Institute"]
license = "CC-BY-4.0"
editions = ["zh", "en"]
code = "GOLDEN//OBSERVE"
date = "2026-11-08"

[book.title]
zh = "黄金整数与可观测性"
en = "Golden Integers and Observability"

[book.subtitle]
zh = "一本每条定理都经 Lean 内核验证的示例专著"
en = "A sample monograph whose every theorem is kernel-verified in Lean"

[book.description]
zh = "四章与一个附录：从 Zeckendorf 表示的进位亏量出发，经由反驳猜想的有限证书与读数的可观测性，到细化、记忆与熵，再到黄金词与回归。每条定理都引用 trureturing 中已冻结的 Lean 声明，开放问题明确标出；附交互可视化、讲解视频与演示文稿。"
en = "Four chapters and an appendix: from the carry deficit of Zeckendorf representations, through finite certificates that refute conjectures and the observability of readouts, to refinement, memory and entropy, and on to the golden word and its returns. Every theorem cites a Lean declaration frozen in trureturing, and open problems are marked as open. With an interactive visualization, an explainer film and a slide deck."

[outputs]
html = true
pdf = ["screen", "print", "academic"]
epub = true

[pdf]
paper = "a4"

[epub]
embed_fonts = false
