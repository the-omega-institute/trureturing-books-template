name: 缺陷报告
description: 报告工具、构建、交互或发布错误。
title: "fix: "
body:
  - type: input
    id: location
    attributes:
      label: 影响位置
      description: 文件路径、页面链接、命令或输出格式。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤与当前结果
      description: 给出最小输入、执行步骤及必要日志。
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望结果
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境与版本
      description: 仓库提交、模板版本、系统或浏览器；工具链问题可附 ./tbook doctor 输出。
  - type: textarea
    id: related
    attributes:
      label: 关联事项
      description: 已搜索的相关问题、上下游 Issue/PR 完整链接及补充材料。
