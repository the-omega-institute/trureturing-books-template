name: 改进建议
description: 提议功能、工作流或仓库维护改进。
title: "feat: "
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 说明具体使用场景与当前限制。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案与范围
      description: 说明预期结果、受影响对象和上游模板或下游书库的归属。
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: 验收条件
      description: 列出可确认完成的条件，以及迁移或兼容要求。
    validations:
      required: true
  - type: textarea
    id: related
    attributes:
      label: 关联事项与备选方案
      description: 附上下游 Issue/PR 完整链接；可补充其他方案。
