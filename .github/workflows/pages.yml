# Build every book and deploy _site/ to GitHub Pages
# (managed by the template).
#
# One-time setup: Settings → Pages → Build and deployment → Source: GitHub Actions.
# Until then the probe job warns and the site is built but not deployed.
#
# Build cache (docs/PUBLISHING.md §5): a unit whose inputs did not change is restored, from the Actions
# cache and published releases. One publisher holds the group through deployment; GitHub
# keeps the latest pending update while the current publication completes.
name: Pages
run-name: ${{ format('Pages · {0}', github.sha) }}

on:
  push:
    branches: [main]
  schedule:
    - cron: '34 * * * *'
    - cron: '17 5 * * *'
  workflow_dispatch:
    inputs:
      selection_mode:
        description: auto selects affected site inputs; full forces complete assembly
        type: choice
        options: [auto, full]
        default: auto

permissions:
  contents: read
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'

jobs:
  plan:
    name: Plan affected work
    permissions:
      contents: read
      actions: read
      deployments: read
      pages: read
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      plan: ${{ steps.plan.outputs.plan }}
      trureturing_sha: ${{ steps.lock.outputs.sha }}
      site: ${{ steps.plan.outputs.site }}
      publish: ${{ steps.plan.outputs.publish }}
      films: ${{ steps.plan.outputs.films }}
      film_matrix: ${{ steps.plan.outputs.film_matrix }}
    steps:
      - name: Check out the tested tree and complete history
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Compare this queued commit with the live site
        id: eligible
        env:
          GH_TOKEN: ${{ github.token }}
          PAGES_SCHEDULE: ${{ github.event.schedule }}
          TRURETURING_TOKEN: ${{ secrets.TRURETURING_TOKEN }}
        run: PYTHONPATH=tools python3 -m ci.pages_schedule
      - name: Resolve the trureturing branch
        if: steps.eligible.outputs.publish == 'true'
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          TRURETURING_TOKEN: ${{ secrets.TRURETURING_TOKEN }}
        run: |
          sha="$(./tbook resolve-lock --branch-head)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Select before installing or downloading caches
        if: steps.eligible.outputs.publish == 'true'
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_REFRESH_SHA: ${{ github.event_name == 'schedule' && github.sha || '' }}
          CI_WORKFLOW_REF: ${{ github.workflow_ref }}
          SELECTION_MODE: ${{ inputs.selection_mode || 'auto' }}
          TBOOK_TRURETURING_SHA: ${{ steps.lock.outputs.sha }}
        run: python3 tools/ci/plan.py --workflow pages

  admit:
    name: Reserve a Pages publication slot
    needs: plan
    if: needs.plan.outputs.site == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    permissions:
      contents: read
      deployments: write
    outputs:
      attempt: ${{ steps.slot.outputs.attempt }}
    steps:
      - uses: actions/checkout@v5
      - name: Apply the rolling hourly limit
        id: slot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PYTHONPATH=tools python3 -m ci.pages_rate
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

  probe:
    needs: plan
    if: needs.plan.outputs.site == 'true'
    name: Is GitHub Pages enabled?
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pages: read
    outputs:
      enabled: ${{ steps.pages.outputs.enabled }}
      base_url: ${{ steps.pages.outputs.base_url }}
    steps:
      - uses: actions/checkout@v5
      - name: Query the Pages configuration
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=tools python3 -m ci.pages_schedule --probe

  films:
    name: Prepare publication films (${{ matrix.shard }})
    needs: [plan, admit, probe]
    if: needs.plan.outputs.films == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.film_matrix) }}
    permissions:
      contents: read
      actions: read
    env:
      TBOOK_TRURETURING_SHA: ${{ needs.plan.outputs.trureturing_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - uses: ./.github/actions/resolve-lock
        env:
          TRURETURING_TOKEN: ${{ secrets.TRURETURING_TOKEN }}
      - name: Set up film tools
        uses: ./.github/actions/setup
        with:
          browsers: 'true'
          films: 'true'
          fonts: 'false'
          mdbook: 'false'
      - name: Restore completed CI inputs
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          scope: films
          pages-url: ${{ needs.probe.outputs.base_url }}
      - name: Snapshot prior entries
        run: python3 tools/ci/cache_store.py snapshot "$RUNNER_TEMP/before.json"
      - name: Build selected film shard
        env:
          TBOOK_CACHE_REMOTE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          FILMS_JSON: ${{ toJSON(matrix.items) }}
        run: python3 tools/ci/films.py --selection-env FILMS_JSON
      - name: Export selected complete film entries
        env:
          FILMS_JSON: ${{ toJSON(matrix.items) }}
        run: python3 tools/ci/cache_store.py export --baseline "$RUNNER_TEMP/before.json" --out "$RUNNER_TEMP/film-entries" --include-films-env FILMS_JSON
      - name: Share prepared films
        uses: actions/upload-artifact@v6
        with:
          name: tbook-pages-films-${{ github.run_attempt }}-${{ strategy.job-index }}
          path: ${{ runner.temp }}/film-entries
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: warn
          retention-days: 1

  build:
    outputs:
      attempt: ${{ steps.attempt.outputs.number }}
    name: Build the site
    needs: [plan, admit, probe, films]
    if: always() && !cancelled() && needs.admit.result == 'success' && needs.probe.result == 'success' && (needs.films.result == 'success' || needs.films.result == 'skipped') && needs.plan.outputs.site == 'true'
    runs-on: ubuntu-24.04
    # Rendering a film that no cache holds takes long (frames, narration, encoding). The build step has a
    # shorter limit of its own: a step that runs out of time fails, while a job that does is cancelled and
    # skips the save, so every unit built until then would be lost and the next run would start over.
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      deployments: write
    env:
      TBOOK_TRURETURING_SHA: ${{ needs.plan.outputs.trureturing_sha }}
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: ${{ needs.admit.outputs.attempt != github.run_attempt && '0' || '1' }}
      - name: Reserve a slot for a retried build
        if: needs.admit.outputs.attempt != github.run_attempt
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=tools python3 -m ci.pages_rate --retry
      - id: attempt
        run: echo "number=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/resolve-lock
        env:
          TRURETURING_TOKEN: ${{ secrets.TRURETURING_TOKEN }}

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          browsers: 'true'
          fonts: 'true'
          mdbook: 'true'
          films: 'true'

      - name: Cache trureturing frozen state
        # Only on the default branch: a run dispatched on another branch could restore what that branch's
        # code saved (docs/VERIFICATION.md §2).
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache@v5
        with:
          path: .cache/trureturing
          key: trureturing-state-${{ hashFiles('trureturing.lock.json') }}
          restore-keys: trureturing-state-

      - name: Restore the build cache (and use the Pages URL)
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          film-baseline: 'true'
          pages-url: ${{ needs.probe.outputs.base_url }}

      - name: Download prepared film entries
        if: needs.plan.outputs.films == 'true'
        continue-on-error: true
        uses: actions/download-artifact@v7
        with:
          pattern: tbook-pages-films-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/prepared-film-shards
      - name: Import verified film entries
        if: needs.plan.outputs.films == 'true'
        run: python3 tools/ci/cache_store.py merge --prefer-imported "$RUNNER_TEMP"/prepared-film-shards/*

      - name: Check
        env:
          # check asks GitHub's compare API whether the pinned trureturing commit is on the site.toml branch
          # (no trureturing checkout here); in GitHub Actions an unanswered question is an error.
          GITHUB_TOKEN: ${{ github.token }}
          # Optional repository secret for a private trureturing (raw files and the compare API).
          TRURETURING_TOKEN: ${{ secrets.TRURETURING_TOKEN }}
        run: ./tbook check

      - name: Restore the GitHub Release catalog
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/cache/restore@v5
        with:
          path: .cache/github-release-catalog
          key: pages-release-catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pages-release-catalog-v1-
      - name: Record the restored catalog digest
        id: release-catalog
        run: echo "digest=${{ hashFiles('.cache/github-release-catalog/*.json') }}" >> "$GITHUB_OUTPUT"

      - name: Build everything
        id: build
        # Below the job's limit, so that the save below still runs: what was built is kept, and a re-run
        # (or the next push) continues from there.
        timeout-minutes: 210
        env:
          # Units missing from the Actions cache are looked up in the newest published releases.
          TBOOK_CACHE_REMOTE: '1'
          TBOOK_RELEASE_CACHE: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && '.cache/github-release-catalog' || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          # The site never goes out without a film: one that cannot be rendered fails the build.
          TBOOK_FILMS: require
        run: ./tbook build all

      - name: Save the GitHub Release catalog
        if: >-
          ${{ !cancelled() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
          hashFiles('.cache/github-release-catalog/*.json') != '' &&
          hashFiles('.cache/github-release-catalog/*.json') != steps.release-catalog.outputs.digest }}
        uses: actions/cache/save@v5
        with:
          path: .cache/github-release-catalog
          key: pages-release-catalog-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Save the build cache
        # Also after a failed build: every unit that was built is stored complete (a film rendered before
        # an unrelated failure is not rendered again). The action saves only on the default branch.
        if: ${{ !cancelled() && (steps.build.outcome == 'success' || steps.build.outcome == 'failure') }}
        uses: ./.github/actions/build-cache
        with:
          mode: save

      - name: Upload the Pages artifact
        if: needs.probe.outputs.enabled == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: _site

      - name: Publish the complete build store
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v6
        with:
          name: tbook-build-store
          overwrite: true
          path: .cache/artifacts
          include-hidden-files: true
          compression-level: 1
          if-no-files-found: warn
          retention-days: 7

      - name: Save reusable visualization images
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: ./.github/actions/build-cache/save-media
        with:
          target: viz-stills

      - name: Publish reusable visualization images
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        continue-on-error: true
        uses: actions/upload-artifact@v6
        with:
          name: tbook-image-store
          overwrite: true
          path: .cache/artifacts/viz-stills
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7

      - name: Save reusable film entries
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: ./.github/actions/build-cache/save-media
        with:
          target: films

      - name: Publish reusable films for pull requests
        if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: actions/upload-artifact@v6
        with:
          name: tbook-film-store
          overwrite: true
          path: .cache/artifacts/films
          include-hidden-files: true
          compression-level: 0
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the site as a workflow artifact
        if: needs.probe.outputs.enabled != 'true'
        uses: actions/upload-artifact@v6
        with:
          name: site
          overwrite: true
          path: _site
          retention-days: 7

  deploy:
    name: Deploy
    needs: [plan, probe, build]
    # A skipped optional film job must not propagate through the successful build.
    if: "!cancelled() && needs.build.result == 'success' && needs.plan.outputs.site == 'true' && needs.probe.outputs.enabled == 'true'"
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    permissions:
      contents: read
      deployments: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out the publication guard for a retry
        if: github.run_attempt > 1
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Recheck the live revision and the reservation before deploying a retry
        if: github.run_attempt > 1
        env:
          GH_TOKEN: ${{ github.token }}
        run: PYTHONPATH=tools python3 -m ci.pages_rate --retry
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ needs.build.outputs.attempt }}

  coverage:
    name: Confirm deployment coverage
    needs: [plan, probe, films, build, deploy]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.plan != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out
        uses: actions/checkout@v5
      - name: Require planned assembly and deployment
        env:
          PAGES_ENABLED: ${{ needs.probe.outputs.enabled }}
        # Keep the full needs fanout in the runner's script/file, never its environment.
        run: |
          cat <<'TBOOK_NEEDS_JSON' > "$RUNNER_TEMP/ci-needs.json"
          ${{ toJSON(needs) }}
          TBOOK_NEEDS_JSON
          python3 tools/ci/plan.py --workflow pages --verify --needs-file "$RUNNER_TEMP/ci-needs.json"
      - name: Record successful deployment coverage
        if: needs.plan.outputs.publish == 'true' && (needs.plan.outputs.site != 'true' || needs.probe.outputs.enabled == 'true')
        uses: actions/upload-artifact@v6
        with:
          name: tbook-coverage-pages
          path: coverage/pages.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
      - name: Record successful film responsibility coverage
        if: needs.plan.outputs.publish == 'true' && needs.plan.outputs.site == 'true'
        uses: actions/upload-artifact@v6
        with:
          name: tbook-coverage-films
          path: coverage/films.json
          if-no-files-found: error
          retention-days: 90
          overwrite: true
