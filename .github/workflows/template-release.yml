# Publish a release of the template itself (only in the-omega-institute/trureturing-books-template).
#
# Maintainers: move docs/CHANGELOG.md [Unreleased] to "## [X.Y.Z] - YYYY-MM-DD", set template.toml
# [template].version = "X.Y.Z", run ./tbook template manifest, merge to main, then
#   git tag vX.Y.Z && git push origin vX.Y.Z
# Books repositories pick the release up through template-sync.yml (./tbook template update).
#
# In this repository v* tags are template releases, so release.yml skips them; the example site's build
# cache is attached here instead, as release.yml attaches a books repository's (docs/PUBLISHING.md §5): the
# job "site" builds the whole site as release.yml's build job does and runs ./tbook cache export; publish
# creates the release as a draft, uploads the tars and build-cache.json, then publishes it. The job repeats
# those few steps rather than calling release.yml, whose plan, notes and downloads are about books releases.
name: Template release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: template-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify version and manifest
    if: github.repository == 'the-omega-institute/trureturing-books-template'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Tag matches template.toml
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          import tomllib

          tag = os.environ["TAG"]
          tpl = tomllib.load(open("template.toml", "rb"))["template"]
          prefix, version = tpl.get("tag_prefix", "v"), tpl["version"]
          if not re.fullmatch(r"\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?", version):
              print(f"::error title=Template release::template.toml version {version!r} is not X.Y.Z[-pre]")
              sys.exit(1)
          if tag != prefix + version:
              print(f"::error title=Template release::tag {tag} does not match template.toml version {version} "
                    f"(expected tag {prefix}{version}). Bump template.toml, regenerate the manifest, tag again.")
              sys.exit(1)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as out:
              out.write(f"version={version}\n")
              out.write(f"prerelease={'true' if '-' in version else 'false'}\n")
          print(f"template version {version}")
          PY

      - name: Manifest is up to date
        run: ./tbook template manifest --check

  ci:
    name: CI
    needs: verify
    # What ci.yml's jobs ask for (actions/configure-pages reads the Pages configuration); a called
    # workflow gets no more than its caller grants.
    permissions:
      contents: read
      actions: read
      pages: read
    uses: ./.github/workflows/ci.yml

  site:
    name: Build the example site and export the build cache
    needs: verify
    runs-on: ubuntu-24.04
    # Rendering a film that no cache holds takes long (frames, narration, encoding).
    timeout-minutes: 240
    permissions:
      contents: read
      actions: read
      pages: read
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up the toolchain
        uses: ./.github/actions/setup
        with:
          browsers: 'true'
          fonts: 'true'
          mdbook: 'true'
          films: 'true'

      - name: Configure Pages
        # Build for the Pages URL, as pages.yml does, so that the exported entries carry the site's keys.
        id: pages
        continue-on-error: true
        uses: actions/configure-pages@v6

      - name: Restore the build cache (and use the Pages URL)
        uses: ./.github/actions/build-cache
        with:
          mode: restore
          pages-url: ${{ steps.pages.outputs.base_url }}

      - name: Build everything
        # ./tbook check runs in the job ci.
        env:
          TBOOK_CACHE_REMOTE: '1'
          GITHUB_TOKEN: ${{ github.token }}
          TBOOK_FILMS: require
        run: ./tbook build all

      - name: Export the build cache
        run: ./tbook cache export "$RUNNER_TEMP/build-cache"

      - name: Upload the build cache
        uses: actions/upload-artifact@v6
        with:
          name: build-cache
          path: ${{ runner.temp }}/build-cache
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Create the GitHub release
    needs: [verify, ci, site]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Download the build cache
        uses: actions/download-artifact@v7
        with:
          name: build-cache
          path: ${{ runner.temp }}/build-cache

      - name: Release notes from docs/CHANGELOG.md
        env:
          VERSION: ${{ needs.verify.outputs.version }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          from pathlib import Path

          version, repo, tag = os.environ["VERSION"], os.environ["REPO"], os.environ["TAG"]
          section = []
          log = Path("docs/CHANGELOG.md")
          if log.is_file():
              keep = False
              for line in log.read_text(encoding="utf-8").splitlines():
                  m = re.match(r"^##\s+\[?v?([^\]\s]+)\]?", line)
                  if m:
                      keep = m.group(1) == version
                      continue
                  if re.match(r"^#\s", line):
                      keep = False
                  if keep:
                      section.append(line)
          body = "\n".join(section).strip()
          if not body:
              print(f"::warning title=Template release::docs/CHANGELOG.md has no section for {version}")
              body = f"Template release {version}."
          body += (
              "\n\n---\n\n"
              "升级书库 · Upgrade a books repository:\n\n"
              "```bash\n"
              f"./tbook template update --to {version}\n"
              "```\n\n"
              "或等待每周的 `template-sync` 工作流开出升级 PR · or wait for the weekly `template-sync` pull request. "
              f"[docs/UPGRADING.md](https://github.com/{repo}/blob/{tag}/docs/UPGRADING.md)\n"
          )
          Path(os.environ["RUNNER_TEMP"], "notes.md").write_text(body + "\n", encoding="utf-8")
          print(body)
          PY

      - name: Create the release as a draft, upload the build cache, publish it
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          set -euo pipefail
          title="trureturing-books-template $VERSION"
          cache="$RUNNER_TEMP/build-cache"
          if [ ! -f "$cache/build-cache.json" ]; then
            echo "::error title=Template release::build-cache.json is missing (./tbook cache export)"
            exit 1
          fi
          mapfile -t files < <(find "$cache" -maxdepth 1 -type f | sort)
          printf 'asset: %s\n' "${files[@]}"
          if draft="$(gh release view "$TAG" --json isDraft --jq .isDraft 2>/dev/null)"; then
            gh release edit "$TAG" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
            if [ "$draft" != "true" ]; then
              # A published release is final (immutable where the repository enables it).
              echo "::warning title=Template release::release $TAG is already published; its files are left as they are"
              exit 0
            fi
            # The draft of an earlier attempt: replace its files.
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            gh release create "$TAG" --draft --verify-tag --title "$title" --notes-file "$RUNNER_TEMP/notes.md" "${files[@]}"
          fi
          # Published only now, with every file in place.
          flags=(--draft=false)
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease); else flags+=(--latest); fi
          gh release edit "$TAG" "${flags[@]}"
