name: Toolchain image

on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - tools/container/**
      - .github/workflows/toolchain-image.yml
      - requirements.txt
      - package.json
      - package-lock.json
      - theme/film/requirements.txt
      - theme/film/setup.sh
      - tools/fetch-fonts.sh
      - theme/typst/fonts.sha256
      - tools/install-tectonic.sh
      - .dockerignore
  pull_request:
    paths:
      - tools/container/**
      - .github/workflows/toolchain-image.yml
      - requirements.txt
      - package.json
      - package-lock.json
      - theme/film/requirements.txt
      - theme/film/setup.sh
      - tools/fetch-fonts.sh
      - theme/typst/fonts.sha256
      - tools/install-tectonic.sh
      - .dockerignore
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 2'

permissions:
  contents: read

concurrency:
  group: toolchain-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'the-omega-institute/trureturing-books-template' && github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      IMAGE: ghcr.io/the-omega-institute/trureturing-books-toolchain
    outputs:
      image: ${{ steps.publish.outputs.image }}
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build the toolchain
        uses: docker/build-push-action@v6
        with:
          context: .
          file: tools/container/Dockerfile
          platforms: linux/amd64
          load: true
          no-cache: ${{ github.event_name == 'schedule' }}
          tags: tbook-toolchain:test
          cache-from: ${{ !startsWith(github.event_name, 'pull_request') && 'type=gha,scope=toolchain' || '' }}
          cache-to: ${{ !startsWith(github.event_name, 'pull_request') && 'type=gha,scope=toolchain,mode=max' || '' }}

      - name: Exercise the toolchain without network access
        run: docker run --rm --init --ipc=host --network=none tbook-toolchain:test python /opt/tbook/container/smoke.py

      - name: Check and build the example books in the container
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          docker run --rm --init --ipc=host \
            --volume "$PWD:/work" --workdir /work \
            --env GITHUB_TOKEN --env TBOOK_FILMS=require \
            tbook-toolchain:test bash -euo pipefail -c '
              git config --global --add safe.directory /work
              python /opt/tbook/container/prepare.py
              ./tbook check
              PYTHONPATH=tools python -m unittest discover -s tools/tests
              node tools/node/viz-test.mjs --full
              ./tbook build all
            '

      - name: Sign in to the container registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tested image
        id: publish
        if: github.event_name != 'pull_request'
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          image="$IMAGE:sha-$GITHUB_SHA"
          docker tag tbook-toolchain:test "$image"
          docker push "$image"
          if [ "$GITHUB_REF" = "refs/heads/$DEFAULT_BRANCH" ]; then
            docker tag tbook-toolchain:test "$IMAGE:latest"
            docker push "$IMAGE:latest"
          fi
          digest="$(docker inspect --format='{{index .RepoDigests 0}}' "$image")"
          echo "image=$digest" >> "$GITHUB_OUTPUT"
          {
            echo '### Tested toolchain image'
            echo
            echo "\`$image\`"
            echo
            echo "Pin consumers to \`$digest\`."
          } >> "$GITHUB_STEP_SUMMARY"

  use-image:
    name: Use the preinstalled image in Actions
    needs: image
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --init --ipc=host
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out
        uses: actions/checkout@v5

      - name: Use the preinstalled toolchain
        uses: ./.github/actions/setup
        with:
          browsers: 'true'
          fonts: 'true'
          films: 'true'

      - name: Verify the container checkout
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./tbook doctor
          ./tbook check

  publish-alias:
    name: Publish the verified toolchain digest
    needs: [image, use-image]
    if: >-
      !cancelled() && github.repository == 'the-omega-institute/trureturing-books-template' &&
      ((github.ref_type == 'tag' && startsWith(github.ref_name, 'v')) ||
       (github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && needs.use-image.result == 'success'))
    runs-on: ubuntu-24.04
    timeout-minutes: 105
    permissions:
      contents: read
      actions: read
      packages: write
    env:
      IMAGE: ghcr.io/the-omega-institute/trureturing-books-toolchain
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply the input or release tag to the same manifest
        env:
          TESTED: ${{ needs.image.outputs.image }}
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          key="$(python3 tools/container/prepare.py --image-key)"
          verified="$IMAGE:inputs-$key"
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            if ! docker buildx imagetools inspect "$verified" > /dev/null; then
              # A release can race the default-branch producer of these inputs.
              PYTHONPATH=tools/ci:tools/container python3 - <<'PY'
          import os
          from pathlib import Path
          from pages import wait_for_push
          from prepare import image_source
          sha = image_source(Path.cwd())
          run = wait_for_push(os.environ["GITHUB_REPOSITORY"], "toolchain-image", os.environ["DEFAULT_BRANCH"], sha, minutes=95)
          if run["conclusion"] != "success":
              raise SystemExit(f"Toolchain producer {sha} did not pass: {run['html_url']}")
          PY
            fi
            docker buildx imagetools create --prefer-index=false --tag "$IMAGE:$GITHUB_REF_NAME" --tag "$IMAGE:sha-$GITHUB_SHA" "$verified"
          else
            docker buildx imagetools create --prefer-index=false --tag "$verified" "$TESTED"
          fi
